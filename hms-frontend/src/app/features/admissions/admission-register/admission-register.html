<p>admission-register works!</p>
<div class="admission-register-page">


  <!-- ================================================= -->
  <!-- HEADER -->
  <!-- ================================================= -->

  <div class="page-header">

    <div>

      <h1>
        Register Admission
      </h1>

      <p>
        Admit a patient to the hospital
      </p>

    </div>


    <button
      type="button"
      class="secondary-button"
      (click)="cancel()"
    >

      <span class="material-symbols-outlined">
        arrow_back
      </span>

      Back to Admissions

    </button>

  </div>



  <!-- ================================================= -->
  <!-- FORM -->
  <!-- ================================================= -->

  <section class="form-card">


    <!-- ================================================= -->
    <!-- PATIENT INFORMATION -->
    <!-- ================================================= -->

    <div class="card-header">

      <div>

        <h2>
          Patient Information
        </h2>

        <span>
          Enter the details of the patient being admitted.
        </span>

      </div>

    </div>


    <div class="form-body">


      <!-- PATIENT ID -->

      <div class="form-group">

        <label for="patientId">
          Patient ID
          <span>*</span>
        </label>

        <input
          id="patientId"
          type="text"
          name="patientId"
          [(ngModel)]="admission.patientId"
          placeholder="e.g. PAT-10001"
        />

      </div>


      <!-- PATIENT NAME -->

      <div class="form-group">

        <label for="patientName">
          Patient Name
          <span>*</span>
        </label>

        <input
          id="patientName"
          type="text"
          name="patientName"
          [(ngModel)]="admission.patientName"
          placeholder="Enter patient's full name"
        />

      </div>


      <!-- PATIENT NUMBER -->

      <div class="form-group">

        <label for="patientNumber">
          Patient Number
        </label>

        <input
          id="patientNumber"
          type="text"
          name="patientNumber"
          [(ngModel)]="admission.patientNumber"
          placeholder="e.g. PT-2026-001"
        />

      </div>



      <!-- ================================================= -->
      <!-- MEDICAL TEAM -->
      <!-- ================================================= -->

      <div class="form-group">

        <label for="doctorName">
          Attending Doctor
        </label>

        <input
          id="doctorName"
          type="text"
          name="doctorName"
          [(ngModel)]="admission.doctorName"
          placeholder="Enter doctor's name"
        />

      </div>


      <div class="form-group">

        <label for="doctorId">
          Doctor ID
        </label>

        <input
          id="doctorId"
          type="text"
          name="doctorId"
          [(ngModel)]="admission.doctorId"
          placeholder="e.g. DOC-10001"
        />

      </div>


      <div class="form-group">

        <label for="departmentName">
          Department
        </label>

        <input
          id="departmentName"
          type="text"
          name="departmentName"
          [(ngModel)]="admission.departmentName"
          placeholder="e.g. Internal Medicine"
        />

      </div>



      <!-- ================================================= -->
      <!-- ADMISSION DETAILS -->
      <!-- ================================================= -->

      <div class="form-group">

        <label for="ward">
          Ward
          <span>*</span>
        </label>

        <select
          id="ward"
          name="ward"
          [(ngModel)]="admission.ward"
        >

          @for (
            ward of wards;
            track ward
          ) {

            <option
              [value]="ward"
            >

              {{ ward }}

            </option>

          }

        </select>

      </div>


      <div class="form-group">

        <label for="bedNumber">
          Bed Number
        </label>

        <input
          id="bedNumber"
          type="text"
          name="bedNumber"
          [(ngModel)]="admission.bedNumber"
          placeholder="e.g. B-102"
        />

      </div>


      <div class="form-group">

        <label for="admissionType">
          Admission Type
          <span>*</span>
        </label>

        <select
          id="admissionType"
          name="admissionType"
          [(ngModel)]="admission.admissionType"
        >

          @for (
            type of admissionTypes;
            track type
          ) {

            <option
              [value]="type"
            >

              {{ type }}

            </option>

          }

        </select>

      </div>



      <!-- ================================================= -->
      <!-- DATES -->
      <!-- ================================================= -->

      <div class="form-group">

        <label for="admissionDate">
          Admission Date
          <span>*</span>
        </label>

        <input
          id="admissionDate"
          type="date"
          name="admissionDate"
          [(ngModel)]="admission.admissionDate"
        />

      </div>


      <div class="form-group">

        <label for="expectedDischargeDate">
          Expected Discharge Date
        </label>

        <input
          id="expectedDischargeDate"
          type="date"
          name="expectedDischargeDate"
          [(ngModel)]="admission.expectedDischargeDate"
        />

      </div>



      <!-- ================================================= -->
      <!-- REASON -->
      <!-- ================================================= -->

      <div class="form-group full-width">

        <label for="reason">
          Reason for Admission
          <span>*</span>
        </label>

        <textarea
          id="reason"
          name="reason"
          [(ngModel)]="admission.reason"
          rows="4"
          placeholder="Describe the reason for admitting the patient..."
        ></textarea>

      </div>



      <!-- ================================================= -->
      <!-- DIAGNOSIS -->
      <!-- ================================================= -->

      <div class="form-group full-width">

        <label for="diagnosis">
          Diagnosis
        </label>

        <textarea
          id="diagnosis"
          name="diagnosis"
          [(ngModel)]="admission.diagnosis"
          rows="4"
          placeholder="Enter the patient's diagnosis..."
        ></textarea>

      </div>



      <!-- ================================================= -->
      <!-- NOTES -->
      <!-- ================================================= -->

      <div class="form-group full-width">

        <label for="notes">
          Additional Notes
        </label>

        <textarea
          id="notes"
          name="notes"
          [(ngModel)]="admission.notes"
          rows="4"
          placeholder="Enter any additional admission notes..."
        ></textarea>

      </div>

    </div>



    <!-- ================================================= -->
    <!-- ACTIONS -->
    <!-- ================================================= -->

    <div class="form-actions">

      <button
        type="button"
        class="secondary-button"
        (click)="cancel()"
      >

        Cancel

      </button>


      <button
        type="button"
        class="primary-button"
        (click)="saveAdmission()"
      >

        <span class="material-symbols-outlined">
          save
        </span>

        Register Admission

      </button>

    </div>

  </section>

</div>
