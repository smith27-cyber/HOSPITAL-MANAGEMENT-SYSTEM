version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: hms-postgres-dev
    environment:
      POSTGRES_DB: hms_database
      POSTGRES_USER: hms_user
      POSTGRES_PASSWORD: leahsm27
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hms_user -d hms_database"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
