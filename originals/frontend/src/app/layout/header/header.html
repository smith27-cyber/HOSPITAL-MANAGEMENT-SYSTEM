
<header class="header">

  <div class="header-left">

    <button
      type="button"
      class="menu-button"
      aria-label="Toggle navigation menu"
      (click)="toggleMenu()"
    >

      <span class="material-symbols-outlined">
        menu
      </span>

    </button>


    <div class="page-title">

      <h1>
        Dashboard
      </h1>

      <span>
        Welcome back, Administrator
      </span>

    </div>

  </div>


  <div class="header-right">

    <button
      type="button"
      class="icon-button"
      aria-label="Notifications"
    >

      <span class="material-symbols-outlined">
        notifications
      </span>

      <span class="notification-dot"></span>

    </button>


    <div class="user-profile">

      <div class="avatar">
        A
      </div>

      <div class="user-info">

        <strong>
          Administrator
        </strong>

        <span>
          System Admin
        </span>

      </div>

      <span class="material-symbols-outlined">
        expand_more
      </span>

    </div>

  </div>

</header>
