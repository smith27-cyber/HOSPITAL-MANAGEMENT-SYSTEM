<div class="hms-layout">

  @if (sidebarOpen) {

    <div
      class="sidebar-overlay"
      (click)="closeSidebar()"
      aria-hidden="true"
    ></div>

  }


  <app-sidebar
    [class.mobile-open]="sidebarOpen"
    (closeSidebar)="closeSidebar()"
  ></app-sidebar>


  <div class="main-section">

    <app-header
      (menuToggle)="toggleSidebar()"
    ></app-header>


    <main class="page-content">

      <router-outlet></router-outlet>

    </main>

  </div>

</div>
