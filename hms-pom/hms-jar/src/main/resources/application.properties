# =====================================================
# HMS APPLICATION
# =====================================================

spring.application.name=hms-backend

# =====================================================
# SERVER
# =====================================================

server.address=0.0.0.0
server.port=8081

# =====================================================
# POSTGRESQL DATABASE
# =====================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/hms_database
spring.datasource.username=hms_user
spring.datasource.password=leahsm27

spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================================
# JPA / HIBERNATE
# =====================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =====================================================
# TIMEZONE
# =====================================================

spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Kampala

# =====================================================
# JSON
# =====================================================

spring.jackson.time-zone=Africa/Kampala

# =====================================================
# LOGGING
# =====================================================

logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO

# =====================================================
# SWAGGER / OPENAPI
# =====================================================

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# =====================================================
# DEVTOOLS - HOT RELOAD
# =====================================================

spring.devtools.restart.enabled=true
spring.devtools.restart.poll-interval=2000
spring.devtools.restart.quiet-period=1000
spring.devtools.livereload.enabled=true
spring.devtools.restart.additional-exclude=static/**,public/**

# =====================================================
# JWT AUTHENTICATION
# =====================================================

# Keep this secret private.
# It must be at least 32 characters long.
hms.jwt.secret=HMS-Super-Secret-Key-2026-For-JWT-Authentication

# Token validity: 8 hours
hms.jwt.expiration=28800000

# =====================================================
# DEV LOGIN (local development / manual & automated testing only)
# =====================================================

# When true, POST /api/auth/dev-login lets a fixed set of dev-only
# accounts (thor, *-testuser) log in with no password. Also requires
# the request to come from the server itself (127.0.0.1/::1) - both
# conditions are enforced regardless of this flag's value. Leave this
# false anywhere but a local machine; override locally with
# HMS_DEV_LOGIN_ENABLED=true rather than editing this file.
hms.dev-login.enabled=false

