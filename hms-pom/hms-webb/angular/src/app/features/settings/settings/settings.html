<div class="settings-page">

  <!-- ================================================= -->
  <!-- HEADER -->
  <!-- ================================================= -->

  <div class="page-header">

    <div>

      <h1>Settings</h1>

      <p>
        Manage your hospital system configuration and preferences.
      </p>

    </div>

  </div>


  <!-- ================================================= -->
  <!-- SETTINGS GRID -->
  <!-- ================================================= -->

  <div class="settings-grid">


    <!-- ================================================= -->
    <!-- HOSPITAL -->
    <!-- ================================================= -->

    <button
      type="button"
      class="settings-card"
      (click)="openHospitalSettings()"
    >

      <div class="settings-icon hospital">

        <span class="material-symbols-outlined">
          local_hospital
        </span>

      </div>

      <div class="settings-content">

        <h2>
          Hospital Information
        </h2>

        <p>
          Manage hospital name, contact details,
          address and registration information.
        </p>

      </div>

      <span class="material-symbols-outlined arrow">
        chevron_right
      </span>

    </button>


    <!-- ================================================= -->
    <!-- PROFILE -->
    <!-- ================================================= -->

    <button
      type="button"
      class="settings-card"
      (click)="openProfileSettings()"
    >

      <div class="settings-icon profile">

        <span class="material-symbols-outlined">
          account_circle
        </span>

      </div>

      <div class="settings-content">

        <h2>
          Profile Settings
        </h2>

        <p>
          Update your name, email, phone number
          and account information.
        </p>

      </div>

      <span class="material-symbols-outlined arrow">
        chevron_right
      </span>

    </button>


    <!-- ================================================= -->
    <!-- USER MANAGEMENT -->
    <!-- ADMIN ONLY -->
    <!-- ================================================= -->

    <button
      *ngIf="canManageUsers()"
      type="button"
      class="settings-card"
      (click)="openUserManagement()"
    >

      <div class="settings-icon users">

        <span class="material-symbols-outlined">
          manage_accounts
        </span>

      </div>

      <div class="settings-content">

        <h2>
          User Management
        </h2>

        <p>
          Create, update, activate, deactivate and
          manage hospital system user accounts.
        </p>

      </div>

      <span class="material-symbols-outlined arrow">
        chevron_right
      </span>

    </button>


    <!-- ================================================= -->
    <!-- SYSTEM -->
    <!-- ================================================= -->

    <button
      type="button"
      class="settings-card"
      (click)="openSystemSettings()"
    >

      <div class="settings-icon system">

        <span class="material-symbols-outlined">
          tune
        </span>

      </div>

      <div class="settings-content">

        <h2>
          System Preferences
        </h2>

        <p>
          Configure currency, date format,
          time format, language and timezone.
        </p>

      </div>

      <span class="material-symbols-outlined arrow">
        chevron_right
      </span>

    </button>


    <!-- ================================================= -->
    <!-- NOTIFICATIONS -->
    <!-- ================================================= -->

    <button
      type="button"
      class="settings-card"
      (click)="openNotifications()"
    >

      <div class="settings-icon notifications">

        <span class="material-symbols-outlined">
          notifications
        </span>

      </div>

      <div class="settings-content">

        <h2>
          Notifications
        </h2>

        <p>
          Manage system, email and SMS
          notification preferences.
        </p>

      </div>

      <span class="material-symbols-outlined arrow">
        chevron_right
      </span>

    </button>


    <!-- ================================================= -->
    <!-- SECURITY -->
    <!-- ================================================= -->

    <button
      type="button"
      class="settings-card"
      (click)="openSecurity()"
    >

      <div class="settings-icon security">

        <span class="material-symbols-outlined">
          security
        </span>

      </div>

      <div class="settings-content">

        <h2>
          Security
        </h2>

        <p>
          Manage passwords, authentication
          and account security preferences.
        </p>

      </div>

      <span class="material-symbols-outlined arrow">
        chevron_right
      </span>

    </button>


    <!-- ================================================= -->
    <!-- DATA -->
    <!-- ================================================= -->

    <button
      type="button"
      class="settings-card"
      (click)="openDataManagement()"
    >

      <div class="settings-icon data">

        <span class="material-symbols-outlined">
          database
        </span>

      </div>

      <div class="settings-content">

        <h2>
          Data Management
        </h2>

        <p>
          Manage system data, backups,
          storage and data maintenance.
        </p>

      </div>

      <span class="material-symbols-outlined arrow">
        chevron_right
      </span>

    </button>


  </div>


  <!-- ================================================= -->
  <!-- SYSTEM INFORMATION -->
  <!-- ================================================= -->

  <section class="system-info">

    <div class="info-icon">

      <span class="material-symbols-outlined">
        info
      </span>

    </div>

    <div>

      <h3>
        Hospital Management System
      </h3>

      <p>
        Configure your HMS according to the
        needs of your hospital.
      </p>

    </div>

  </section>

</div>
