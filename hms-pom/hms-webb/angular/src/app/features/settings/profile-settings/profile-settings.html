<!-- ===================================================== -->

<div class="profile-settings-page">


  <!-- ================================================= -->
  <!-- PAGE HEADER -->
  <!-- ================================================= -->

  <div class="page-header">

    <div>

      <h1>
        Profile Settings
      </h1>

      <p>
        Manage your personal information and account profile.
      </p>

    </div>

  </div>


  <!-- ================================================= -->
  <!-- SETTINGS CARD -->
  <!-- ================================================= -->

  <section class="settings-card">


    <!-- ================================================= -->
    <!-- CARD HEADER -->
    <!-- ================================================= -->

    <div class="card-header">

      <div class="profile-avatar">

        <span class="material-symbols-outlined">
          person
        </span>

      </div>

      <div>

        <h2>
          Personal Information
        </h2>

        <p>
          Update your profile information.
        </p>

      </div>

    </div>


    <!-- ================================================= -->
    <!-- FORM -->
    <!-- ================================================= -->

    <div class="form-grid">


      <!-- =============================================== -->
      <!-- FIRST NAME -->
      <!-- =============================================== -->

      <div class="form-group">

        <label for="firstName">
          First Name
          <span>*</span>
        </label>

        <input
          id="firstName"
          type="text"
          name="firstName"
          [(ngModel)]="profile.firstName"
          placeholder="Enter first name"
        />

      </div>


      <!-- =============================================== -->
      <!-- LAST NAME -->
      <!-- =============================================== -->

      <div class="form-group">

        <label for="lastName">
          Last Name
          <span>*</span>
        </label>

        <input
          id="lastName"
          type="text"
          name="lastName"
          [(ngModel)]="profile.lastName"
          placeholder="Enter last name"
        />

      </div>


      <!-- =============================================== -->
      <!-- EMAIL -->
      <!-- =============================================== -->

      <div class="form-group">

        <label for="email">
          Email Address
          <span>*</span>
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="profile.email"
          placeholder="Enter email address"
        />

      </div>


      <!-- =============================================== -->
      <!-- PHONE -->
      <!-- =============================================== -->

      <div class="form-group">

        <label for="phone">
          Phone Number
        </label>

        <input
          id="phone"
          type="tel"
          name="phone"
          [(ngModel)]="profile.phone"
          placeholder="Enter phone number"
        />

      </div>


      <!-- =============================================== -->
      <!-- USERNAME -->
      <!-- =============================================== -->

      <div class="form-group">

        <label for="username">
          Username
        </label>

        <input
          id="username"
          type="text"
          name="username"
          [(ngModel)]="profile.username"
          placeholder="Enter username"
        />

      </div>


      <!-- =============================================== -->
      <!-- ROLE -->
      <!-- =============================================== -->

      <div class="form-group">

        <label for="role">
          Role
        </label>

        <input
          id="role"
          type="text"
          name="role"
          [(ngModel)]="profile.role"
          readonly
        />

      </div>


      <!-- =============================================== -->
      <!-- DEPARTMENT -->
      <!-- =============================================== -->

      <div class="form-group full-width">

        <label for="department">
          Department
        </label>

        <input
          id="department"
          type="text"
          name="department"
          [(ngModel)]="profile.department"
          placeholder="Enter department"
        />

      </div>

    </div>


    <!-- ================================================= -->
    <!-- ACTIONS -->
    <!-- ================================================= -->

    <div class="form-actions">


      <!-- =============================================== -->
      <!-- CANCEL -->
      <!-- =============================================== -->

      <button
        type="button"
        class="secondary-button"
        (click)="cancel()"
      >

        Cancel

      </button>


      <!-- =============================================== -->
      <!-- SAVE -->
      <!-- =============================================== -->

      <button
        type="button"
        class="primary-button"
        [disabled]="saving"
        (click)="saveProfile()"
      >

        <span class="material-symbols-outlined">
          save
        </span>

        {{ saving ? 'Saving...' : 'Save Changes' }}

      </button>

    </div>

  </section>

</div>
