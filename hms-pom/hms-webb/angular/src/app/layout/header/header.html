<!-- =====================================================
     HEADER
     ===================================================== -->

<header class="header">


  <!-- ===================================================
       LEFT
       =================================================== -->

  <div class="header-left">

    <button
      type="button"
      class="menu-button"
      aria-label="Toggle navigation menu"
      (click)="toggleMenu()"
    >

      <span class="material-symbols-outlined">
        menu
      </span>

    </button>


    <div class="page-title">

      <h1>
        Hospital Management System
      </h1>

      <span>
        Welcome back, {{ fullName }}
      </span>

    </div>

  </div>



  <!-- ===================================================
       RIGHT
       =================================================== -->

  <div class="header-right">


    <!-- ================================================ -->
    <!-- NOTIFICATIONS -->
    <!-- ================================================ -->

    <button
      type="button"
      class="icon-button"
      aria-label="Notifications"
    >

      <span class="material-symbols-outlined">
        notifications
      </span>

      <span class="notification-dot"></span>

    </button>



 <!-- ================================================ -->
<!-- USER PROFILE -->
<!-- ================================================ -->

<button
  type="button"
  class="user-profile"
  aria-label="Open profile settings"
  (click)="openProfileSettings()"
>

  <div class="avatar">
    {{ avatarInitials }}
  </div>


  <div class="user-info">

    <strong>
      {{ fullName }}
    </strong>

    <span>
      {{ role }}
    </span>

  </div>


  <span class="material-symbols-outlined">
    expand_more
  </span>

</button>
  </div>

</header>
