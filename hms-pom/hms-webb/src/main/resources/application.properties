# =====================================================
# HMS WEBB APPLICATION
# =====================================================

spring.application.name=hms-webb

# =====================================================
# SERVER
# =====================================================

server.address=0.0.0.0
server.port=8080

# Static content (the Angular build) is served straight from
# src/main/resources/static — Spring Boot's default static location.
# `ng build` writes there directly (see angular.json outputPath),
# so nothing else needs to be configured here.

# =====================================================
# DEVTOOLS - HOT RELOAD
# =====================================================

spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
